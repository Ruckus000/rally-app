name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` is load-bearing, not decoration. The jobs below skip
    # draft PRs, so without this type nothing would ever run for a branch that
    # was opened as a draft and later marked ready — the checks would sit
    # unstarted and the PR could never go green.
    types: [opened, synchronize, reopened, ready_for_review]

# A second push to the same PR branch makes the first run's answer irrelevant,
# and the integration job holds a Docker-heavy runner for minutes. Cancel it.
#
# Not on `main`, though, and the difference matters. On a branch the two runs
# are two answers about the same work in progress; on `main` they are two
# different commits, each of which is something someone can check out. Killing
# the older one leaves a merge commit that nothing ever verified — which is
# exactly what happened three times in one evening, when each merge cancelled
# the run belonging to the merge before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # Draft PRs do not run CI. Agents push work in progress many times before a
    # branch is finished, and a run against a half-written commit is a red X
    # that means nothing except "not done yet" — while still sending a "PR run
    # failed" notification to a human who cannot act on it. Marking the PR ready
    # for review fires `ready_for_review` above and this runs for real.
    #
    # Note for anyone tempted to drop the draft check: a required status check
    # skipped by an `if:` counts as *passing* to branch protection. This is only
    # safe because GitHub refuses to merge a draft PR at all. Remove the draft
    # gate here and you have removed the merge gate on main with it.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

  # Expect 4-7 minutes, almost all of it the first-time Docker image pull for
  # postgres/gotrue/postgrest/realtime/storage. No secrets are required: every
  # step here runs against the local stack on the runner, nothing touches the
  # hosted Supabase project.
  integration:
    # Same reasoning as `check` above, and more of it: this is the job that
    # holds a runner for minutes pulling Docker images.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Deliberately NO supabase/setup-cli action. `@supabase/cli-linux-x64` is
      # an optionalDependency in package-lock.json, so `npm ci` already installs
      # the CLI at exactly the version that wrote and verified these migrations.
      # Adding setup-cli would silently install a *different*, floating version
      # and reintroduce the local/CI skew the lockfile exists to prevent.
      - run: npm ci

      # Shared GitHub runner IPs regularly hit anonymous Docker Hub pull limits,
      # which is by far the likeliest cause of an intermittent red build here.
      # One stop-and-retry turns that transient 429 into a slow pass rather than
      # a false failure. A second failure is real and should stay red.
      - name: Start Supabase
        run: |
          npx supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,mailpit \
            || {
              echo "::warning::supabase start failed once — retrying (usually a Docker Hub pull limit)"
              npx supabase stop --no-backup || true
              npx supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,mailpit
            }

      # Its own step so a broken migration or seed reads as a migration failure
      # in the job summary instead of hiding inside the test step's output.
      - name: Apply migrations and seed
        run: npx supabase db reset --local

      # Informational, and now deliberately so rather than pending. The note
      # here used to say "read the output of one real run, then drop
      # continue-on-error". That was done, and the answer is that this step
      # cannot become a gate, because the thing it runs is not the linter whose
      # findings matter.
      #
      # `--local` emits INFO and nothing else. On this schema it returns six,
      # all `rls_enabled_no_policy` for the tables that are readable by nobody
      # on purpose — `reports`, `device_tokens`, `media_gc` and friends. It was
      # given a table with RLS disabled in `public` and a `security definer`
      # view, both of which the hosted linter calls ERROR, and it reported them
      # as INFO too. There is no arrangement of this schema that makes it emit
      # an ERROR, so `--fail-on error` is a gate that cannot fail — which is
      # worse than no gate, because it reads like one.
      #
      # `--fail-on` is also not self-consistent: on its own it returns 0 with
      # six findings present, and combined with `--level warn` it returns 1
      # with nothing displayed at all. Not a flag to build a gate on.
      #
      # The findings that matter come from the hosted advisor, which sees a
      # different set entirely — twenty-eight on the same schema, twenty-two of
      # them WARN. Almost all are decisions this repo argued for in writing:
      # the intentional `SECURITY DEFINER` RPCs, and the anonymous-access
      # policies that exist because anonymous sign-in *is* the account model.
      # Gating on those would fail every build on day one and teach everyone to
      # ignore the colour, which is the failure this note has always been about.
      #
      # So: a real gate means running against the linked project, which needs a
      # token here, and baselining the twenty-two known WARNs first. Worth doing
      # the day a finding is ever acted on. Not before.
      - name: Security advisors
        continue-on-error: true
        run: npx supabase db advisors --local --type security --level info

      - name: Integration tests
        run: npm run test:integration -- --ci

      - name: Container state on failure
        if: failure()
        run: docker ps -a

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
